# プッシュ / PR 時の検証パイプライン
name: verify

on:
  # main/master プッシュと全プルリクエスト
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # Go / Node セットアップ後の verify.sh 実行（PostgreSQL 統合テスト込み）
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tasmane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'

      # cf は Node.js 22.23 以上が必要
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare test database extensions
        run: |
          PGPASSWORD=test psql -h 127.0.0.1 -U postgres -d tasmane -c 'CREATE EXTENSION IF NOT EXISTS citext SCHEMA public' -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA public'

      - name: Verify
        env:
          GOFLAGS: -buildvcs=false
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/tasmane?sslmode=disable
        run: |
          chmod +x scripts/*.sh
          export TASMANE_GO_BIN="$(command -v go)"
          export PATH="$(dirname "$TASMANE_GO_BIN"):$PATH"
          bash scripts/verify.sh

      # cf による Worker のビルドとデプロイ前検証（認証不要の dry-run）
      - name: cf deploy dry-run
        env:
          CF_SEND_TELEMETRY: 'false'
          TASMANE_API_VPC_SERVICE_ID: 00000000-0000-4000-8000-000000000000
        run: |
          bash scripts/cf-build.sh
          npx cf deploy --prebuilt --dry-run
